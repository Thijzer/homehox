services:
  mosquitto:
    image: eclipse-mosquitto:${MOSQUITTO_IMAGE_TAG}
    container_name: ${MOSQUITTO_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${MOSQUITTO_MQTT_PORT}:1883"
    volumes:
      - ${MOSQUITTO_CONFIG_PATH}:/mosquitto/config:ro
      - ${MOSQUITTO_DATA_PATH}:/mosquitto/data
      - ${MOSQUITTO_LOG_PATH}:/mosquitto/log
